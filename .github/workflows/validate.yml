name: Registry and site checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate registry structure, task identity and cohort arithmetic
        run: node scripts/validate-registry.mjs
      - name: Check append-only history against PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if git cat-file -e "$BASE_SHA:dist/data/registry.json" 2>/dev/null; then
            git show "$BASE_SHA:dist/data/registry.json" > "$RUNNER_TEMP/registry-base.json"
            node scripts/validate-registry.mjs --base-file "$RUNNER_TEMP/registry-base.json"
          fi
      - name: Run meaningful registry and site tests
        run: node --test test/*.test.mjs
      - name: Check static assets and evidence bindings
        run: node scripts/check-site.mjs
